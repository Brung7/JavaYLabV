name: Java CI/CD with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # --------------------------
      # 2. Подготовка
      # --------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------
      # 3. Настройка CI (Maven сборка и тесты)
      # --------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'  # Автоматическое кеширование зависимостей Maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

